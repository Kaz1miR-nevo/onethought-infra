# =============================================================================
# ClusterSecretStore for AWS Secrets Manager
# =============================================================================
# This allows External Secrets Operator to fetch secrets from AWS
# =============================================================================

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      auth:
        # Uses the service account's IAM role (IRSA)
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets

---
# =============================================================================
# External Secrets Operator Service Account
# =============================================================================
# Must have IAM role annotation for IRSA

apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: external-secrets
  annotations:
    # Replace with actual role ARN from Terraform output
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/onethought-${ENVIRONMENT}-external-secrets

