# =============================================================================
# Loki Helm Values
# =============================================================================
# Configuration for Grafana Loki
# =============================================================================

# Loki runs in single binary mode for simplicity
# For high-scale production, consider distributed mode
loki:
  auth_enabled: false
  
  commonConfig:
    replication_factor: 1
  
  storage:
    type: s3
    bucketNames:
      chunks: "${s3_bucket}"
      ruler: "${s3_bucket}"
      admin: "${s3_bucket}"
    s3:
      region: "${aws_region}"
      s3ForcePathStyle: false
      insecure: false

# Service Account with IAM role
serviceAccount:
  create: true
  name: loki
  annotations:
    eks.amazonaws.com/role-arn: "${loki_role_arn}"

# Single Binary deployment
singleBinary:
  replicas: ${environment == "prod" ? 2 : 1}
  
  persistence:
    enabled: true
    storageClass: "${storage_class}"
    size: ${environment == "prod" ? "50Gi" : "20Gi"}
  
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Gateway (nginx)
gateway:
  enabled: true
  replicas: ${environment == "prod" ? 2 : 1}
  
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Retention and limits
loki:
  limits_config:
    retention_period: ${environment == "prod" ? "720h" : "168h"}  # 30 days vs 7 days
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20
    max_streams_per_user: 10000
    max_line_size: 256kb
  
  compactor:
    working_directory: /var/loki/compactor
    shared_store: s3
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 150

# Monitoring
monitoring:
  dashboards:
    enabled: true
  rules:
    enabled: true
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus

# Test disabled
test:
  enabled: false

