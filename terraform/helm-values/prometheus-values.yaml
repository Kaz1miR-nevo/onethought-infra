# =============================================================================
# Prometheus Stack Helm Values
# =============================================================================
# Configuration for kube-prometheus-stack
# =============================================================================

# Grafana Configuration
grafana:
  enabled: true
  
  adminPassword: "${grafana_admin_password}"
  
  serviceAccount:
    create: true
    name: grafana
    annotations:
      eks.amazonaws.com/role-arn: "${grafana_role_arn}"
  
  persistence:
    enabled: true
    storageClassName: "${storage_class}"
    size: 10Gi
  
  ingress:
    enabled: false  # Will be enabled via separate Ingress
  
  # Grafana datasources
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki-gateway.monitoring.svc.cluster.local
      access: proxy
      isDefault: false
    - name: CloudWatch
      type: cloudwatch
      access: proxy
      jsonData:
        authType: default
        defaultRegion: eu-central-1
  
  # Pre-configured dashboards
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
        - name: 'onethought'
          orgId: 1
          folder: 'OneThought'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/onethought
  
  dashboards:
    default:
      kubernetes-cluster:
        gnetId: 6417
        revision: 1
        datasource: Prometheus
      kubernetes-pods:
        gnetId: 6879
        revision: 1
        datasource: Prometheus
      node-exporter:
        gnetId: 1860
        revision: 31
        datasource: Prometheus

# Prometheus Configuration
prometheus:
  prometheusSpec:
    retention: ${environment == "prod" ? "30d" : "7d"}
    
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: "${storage_class}"
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: ${environment == "prod" ? "100Gi" : "50Gi"}
    
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 4Gi
    
    # Additional scrape configs for application metrics
    additionalScrapeConfigs:
      - job_name: 'onethought-backend'
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - onethought
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app]
            regex: backend
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics
            action: keep

# Alertmanager Configuration
alertmanager:
  enabled: true
  
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: "${storage_class}"
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

# Node Exporter
nodeExporter:
  enabled: true

# Kube State Metrics
kubeStateMetrics:
  enabled: true

# Default Rules
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false  # Not managed in EKS
    configReloaders: true
    general: true
    k8s: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubeControllerManager: false  # Not exposed in EKS
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: false  # Not exposed in EKS
    kubeSchedulerRecording: false
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

