# =============================================================================
# OneThought Production Environment - Docker Compose
# =============================================================================
# Deploy with: docker compose -p onethought_prod -f docker-compose.prod.yml up -d
# =============================================================================

version: '3.8'

services:
  # Redis for caching and rate limiting
  redis:
    image: redis:7-alpine
    container_name: onethought_prod_redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    volumes:
      - redis_prod_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - onethought_prod_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    # Security: bind only to internal network
    # No ports exposed to host

  # API Backend
  # NOTE: Clone onethought-api repo to /opt/onethought-api on the server
  api:
    build:
      context: /opt/onethought-api
      dockerfile: Dockerfile
    container_name: onethought_prod_api
    restart: unless-stopped
    env_file:
      - ./env/prod.api.env
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379/1
      - REDIS_PREFIX=prod:
    ports:
      - "3002:3001"
    networks:
      - onethought_prod_network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  # Web Frontend
  # NOTE: Clone OneThought repo to /opt/OneThought on the server
  web:
    build:
      context: /opt/OneThought
      dockerfile: Dockerfile
      args:
        - NODE_ENV=production
        - NEXT_PUBLIC_APP_ENV=prod
        - NEXT_PUBLIC_SITE_URL=https://domain.com
        - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    container_name: onethought_prod_web
    restart: unless-stopped
    env_file:
      - ./env/prod.web.env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_ENV=prod
    ports:
      - "3003:3000"
    networks:
      - onethought_prod_network
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

networks:
  onethought_prod_network:
    driver: bridge
    name: onethought_prod_network

volumes:
  redis_prod_data:
    name: onethought_prod_redis_data

