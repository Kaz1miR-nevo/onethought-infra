{{/*
=============================================================================
Backend Service
=============================================================================
*/}}
{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "onethought.fullname" . }}-backend
  labels:
    {{- include "onethought.backend.labels" . | nindent 4 }}
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: 9090
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "onethought.backend.selectorLabels" . | nindent 4 }}
{{- end }}

