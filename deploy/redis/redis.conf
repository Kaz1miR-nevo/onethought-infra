# =============================================================================
# Redis Configuration for OneThought
# =============================================================================
# This config is used by both stage and prod Redis containers
# Memory limits are set per-environment in docker-compose.yml
# =============================================================================

# Network
bind 0.0.0.0
protected-mode yes
port 6379

# Memory Management
# maxmemory and maxmemory-policy are set via command line in docker-compose
# This allows different limits per environment

# Persistence (disabled for caching use case)
save ""
appendonly no

# Security
# No password required (internal Docker network only)
# Redis is NOT exposed to public internet

# Performance
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Logging
loglevel notice

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60






