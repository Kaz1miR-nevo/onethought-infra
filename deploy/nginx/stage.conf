# =============================================================================
# Nginx Configuration - Stage Environment
# =============================================================================
# Domain: stage.domain.com
# NOTE: Requires websocket.conf to be included in nginx.conf http block
# =============================================================================

upstream stage_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream stage_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name stage.domain.com;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stage.domain.com;

    # SSL Configuration (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/stage.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stage.domain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    include /etc/nginx/snippets/security-headers.conf;

    # Gzip Compression
    include /etc/nginx/snippets/gzip.conf;

    # Logging
    access_log /var/log/nginx/stage.access.log;
    error_log /var/log/nginx/stage.error.log warn;

    # Client body size (for media uploads)
    client_max_body_size 50M;
    client_body_timeout 60s;
    client_header_timeout 60s;

    # Proxy timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Health check endpoint (bypass rate limiting) - must be before /api
    location = /api/health {
        proxy_pass http://stage_api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # Auth endpoints with strict rate limiting
    location ~ ^/api/v1/auth {
        limit_req zone=auth_limit burst=5 nodelay;

        proxy_pass http://stage_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # API Routes with general rate limiting
    location /api {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://stage_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Web Application
    location / {
        proxy_pass http://stage_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

